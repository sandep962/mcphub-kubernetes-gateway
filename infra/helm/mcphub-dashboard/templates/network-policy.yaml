apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcphub-dashboard-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: mcphub-dashboard
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mcphub-gateway
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
