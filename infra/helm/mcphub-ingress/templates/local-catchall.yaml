{{- if .Values.localCatchAll.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcphub-storefront-local
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.localCatchAll.serviceName | quote }}
                port:
                  number: {{ .Values.localCatchAll.servicePort }}
{{- end }}
