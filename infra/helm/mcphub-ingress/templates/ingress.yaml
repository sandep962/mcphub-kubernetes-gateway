{{- range .Values.routes }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcphub-{{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  ingressClassName: {{ $.Values.ingressClassName | quote }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .serviceName | quote }}
                port:
                  number: {{ .servicePort }}
---
{{- end }}
