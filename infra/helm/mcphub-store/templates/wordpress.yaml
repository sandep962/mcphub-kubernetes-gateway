apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcphub-wordpress
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      app: mcphub-wordpress
  template:
    metadata:
      labels:
        app: mcphub-wordpress
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image | quote }}
          imagePullPolicy: {{ .Values.wordpress.imagePullPolicy | quote }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mcphub-mariadb
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: database
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: username
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: password
          volumeMounts:
            - name: wordpress-files
              mountPath: /var/www/html
          startupProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
      volumes:
        - name: wordpress-files
          persistentVolumeClaim:
            claimName: mcphub-wordpress-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcphub-wordpress-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcphub-wordpress
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: mcphub-wordpress
  ports:
    - name: http
      port: {{ .Values.wordpress.servicePort }}
      targetPort: http
