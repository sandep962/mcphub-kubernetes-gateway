apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mcphub-mariadb
  namespace: {{ .Values.namespace }}
spec:
  serviceName: mcphub-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mcphub-mariadb
  template:
    metadata:
      labels:
        app: mcphub-mariadb
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          imagePullPolicy: {{ .Values.mariadb.imagePullPolicy | quote }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret | default "mcphub-db-secret" | quote }}
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcphub-mariadb
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: mcphub-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
