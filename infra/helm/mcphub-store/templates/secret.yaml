{{- if not .Values.mariadb.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: mcphub-db-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  database: wordpress
  username: wpuser
  password: {{ required "Set mariadb.password in a private values file" .Values.mariadb.password | quote }}
  root-password: {{ required "Set mariadb.rootPassword in a private values file" .Values.mariadb.rootPassword | quote }}

{{- end }}
