namespace: mcphub
storageClassName: standard
wordpress:
  image: mcphub-wordpress:local
  imagePullPolicy: IfNotPresent
  replicas: 1
  servicePort: 80
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
mariadb:
  image: mariadb:11.4
  imagePullPolicy: IfNotPresent
  existingSecret: ""
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
imagePullSecrets: []

