# Replace the image before deployment.
namespace: mcphub
replicaCount: 2
image: "REPLACE_WITH_REGISTRY/mcphub-support-mcp:REPLACE_WITH_IMMUTABLE_TAG"
imagePullPolicy: IfNotPresent
imagePullSecrets:
  - name: mcphub-registry-pull
service:
  type: ClusterIP
  port: 8003
database:
  autoMigrate: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
