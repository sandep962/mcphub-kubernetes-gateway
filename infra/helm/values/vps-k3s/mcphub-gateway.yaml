# Replace the image before deployment. OAuth intentionally remains disabled.
namespace: mcphub
replicas: 2
image: "REPLACE_WITH_REGISTRY/mcphub-gateway:REPLACE_WITH_APPROVED_IMMUTABLE_TAG"
imagePullPolicy: IfNotPresent
imagePullSecrets:
  - name: mcphub-registry-pull
servicePort: 8000
upstreamToolCallTimeoutSeconds: 30
database:
  autoMigrate: false
woocommerceMcpUrl: http://mcphub-woocommerce-mcp.mcphub.svc.cluster.local:8001/mcp
inventoryMcpUrl: http://mcphub-inventory-mcp.mcphub.svc.cluster.local:8002/mcp
supportMcpUrl: http://mcphub-support-mcp.mcphub.svc.cluster.local:8003/mcp
oauth:
  issuerUrl: ""
  resourceUrl: ""
llm:
  baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-3.5-flash-lite
  apiKeySecretName: mcphub-llm-secret
  apiKeySecretKey: api-key
  apiEgressCidrs:
    - 172.217.112.4/32
    - 172.217.113.4/32
    - 172.217.114.4/32
    - 172.217.115.4/32
    - 172.217.116.4/32
    - 172.217.117.4/32
    - 172.217.118.4/32
    - 172.217.119.4/32
