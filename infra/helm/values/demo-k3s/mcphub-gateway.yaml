namespace: mcphub
replicas: 2
image: docker.io/library/mcphub-gateway:demo
imagePullPolicy: IfNotPresent
imagePullSecrets: []
servicePort: 8000
upstreamToolCallTimeoutSeconds: 30
database:
  autoMigrate: false
woocommerceMcpUrl: http://mcphub-woocommerce-mcp.mcphub.svc.cluster.local:8001/mcp
inventoryMcpUrl: http://mcphub-inventory-mcp.mcphub.svc.cluster.local:8002/mcp
supportMcpUrl: http://mcphub-support-mcp.mcphub.svc.cluster.local:8003/mcp
oauth:
  # OAuth routes remain disabled until issuer/resource URLs and schema-v4 migration are approved.
  issuerUrl: ""
  resourceUrl: ""
llm:
  baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-3.5-flash-lite
  apiKeySecretName: mcphub-llm-secret
  apiKeySecretKey: api-key
  apiEgressCidrs:
    - 172.217.112.4/32
    - 172.217.113.4/32
    - 172.217.114.4/32
    - 172.217.115.4/32
    - 172.217.116.4/32
    - 172.217.117.4/32
    - 172.217.118.4/32
    - 172.217.119.4/32
