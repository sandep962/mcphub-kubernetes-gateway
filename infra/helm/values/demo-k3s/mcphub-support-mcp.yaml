namespace: mcphub
replicaCount: 2
image: docker.io/library/mcphub-support-mcp:demo
imagePullPolicy: IfNotPresent
imagePullSecrets: []
database:
  autoMigrate: false
service:
  type: ClusterIP
  port: 8003
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
