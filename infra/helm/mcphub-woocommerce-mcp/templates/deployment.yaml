{{- $woocommerceSecret := lookup "v1" "Secret" .Values.namespace "mcphub-woocommerce-api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcphub-woocommerce-mcp
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: mcphub-woocommerce-mcp
  template:
    metadata:
      labels:
        app: mcphub-woocommerce-mcp
      annotations:
        checksum/woocommerce-api-secret: {{ if $woocommerceSecret }}{{ toJson $woocommerceSecret.data | sha256sum | quote }}{{ else }}{{ "missing" | quote }}{{ end }}
    spec:
      containers:
        - name: server
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: WOOCOMMERCE_CANONICAL_URL
              value: {{ required "Set woocommerceCanonicalUrl to the WordPress home URL reported by the REST index" .Values.woocommerceCanonicalUrl | quote }}
            - name: WOOCOMMERCE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcphub-woocommerce-api
                  key: base-url
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: mcphub-woocommerce-api
                  key: consumer-key
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcphub-woocommerce-api
                  key: consumer-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
