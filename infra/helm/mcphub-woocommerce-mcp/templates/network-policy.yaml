apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcphub-woocommerce-mcp-from-gateway
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: mcphub-woocommerce-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcphub-gateway
      ports:
        - protocol: TCP
          port: 8001
