apiVersion: batch/v1
kind: Job
metadata:
  name: mcphub-db-provisioner
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: mcphub-db-provisioner
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provisioner
          image: {{ .Values.provisionerImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          command: ["python", "-m", "apps.shared.provision_database"]
          env:
            - name: MARIADB_HOST
              value: {{ .Values.databaseHost | quote }}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcphub-db-secret
                  key: root-password
            - name: MCPHUB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
